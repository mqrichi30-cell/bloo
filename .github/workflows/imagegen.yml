# bloo product-image worker (imagegen/). Free tiers only; see docs/IMAGE_PROVIDERS.md.
# FLUX.2 edit of the real product + local fidelity gate; the plate composite is off unless IMAGEGEN_ALLOW_COMPOSITE=1.
# This is the ONLY worker (no PC runner). Budget: private repo = 2,000 Actions min/month on a
# 2 vCPU / 7 GB runner; we stay under ~1,500: 4 runs/day x <=12 min (timeout) = 48 min/day worst case
# (~1,440/month). An idle run exits in the first step (~1 billed minute). ~1 min/job on the edit path,
# so a 10 min pass does ~9-10 jobs -> ~40 jobs/day, below the ~58/day Cloudflare free edit quota.
name: imagegen

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 h (off the :00 rush); see budget math above
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Max jobs this run"
        default: "15"
      max_minutes:
        description: "Time budget (minutes)"
        default: "10"

permissions:
  contents: read

concurrency:
  group: imagegen
  cancel-in-progress: false

jobs:
  imagegen:
    runs-on: ubuntu-latest
    timeout-minutes: 12 # hard cap per run: keeps the monthly minutes budget
    env:
      BLOO_URL: https://bloo-panel.netlify.app
    steps:
      # Cheap gate: no Python, no model download when there is nothing to do.
      - name: Check pending jobs
        id: pending
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          body=$(curl -fsS --max-time 30 -H "x-cron-secret: ${CRON_SECRET}" "${BLOO_URL}/api/imagegen/pending-count")
          count=$(printf '%s' "$body" | jq -r '.pending // .count // 0')
          echo "pending jobs: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pending.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: imagegen
          persist-credentials: false

      - name: Set up Python
        if: steps.pending.outputs.count != '0'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: imagegen/requirements.txt

      # restore/save split: a plain actions/cache only saves on success, so a failed run
      # re-downloaded ~1.2 GB of weights every time
      - name: Restore rembg / BiRefNet weights
        if: steps.pending.outputs.count != '0'
        id: weights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: rembg-${{ vars.IMAGEGEN_REMBG_MODEL || 'birefnet-general' }}-gate-lite-v2

      - name: Install dependencies
        if: steps.pending.outputs.count != '0'
        working-directory: imagegen
        run: pip install -r requirements.txt

      - name: Run worker
        if: steps.pending.outputs.count != '0'
        working-directory: imagegen
        env:
          U2NET_HOME: ~/.u2net
          RUNNER_KIND: github # anonymous (per-IP) quota state is kept apart from the PC's
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ALLOW_PAID: ${{ vars.GEMINI_ALLOW_PAID }}
          IMAGEGEN_REMBG_MODEL: ${{ vars.IMAGEGEN_REMBG_MODEL }}
          HF_SPACE_DISABLED: ${{ vars.HF_SPACE_DISABLED }}
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '15' }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '10' }}
          IMAGEGEN_FIRST_JOB_SECONDS: "90" # model load + first edit job on 2 vCPU
          # memory: 7 GB runner; ORT arena is off in code, glibc keeps fewer/trimmed heaps
          MALLOC_ARENA_MAX: "2"
          MALLOC_TRIM_THRESHOLD_: "131072"
          PYTHONUNBUFFERED: "1"
        run: python -m imagegen.run --once --max-jobs "$MAX_JOBS" --max-minutes "$MAX_MINUTES"

      - name: Save rembg / BiRefNet weights
        if: always() && steps.pending.outputs.count != '0' && steps.weights.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: ${{ steps.weights.outputs.cache-primary-key }}

