# bloo product-image worker (imagegen/); see docs/IMAGE_PROVIDERS.md.
# Hero: ONE paid GPT Image edit (gpt-image-2.5-sunburst, quality max; ~$0.22/img unpriced estimate,
# real cost from `usage`) + free local gates, real-pixel restore and
# AI review; a hard rejection falls back to the free FLUX.2 edit (cfedit). No pacing on the paid route:
# the panel should fire workflow_dispatch right away and a run drains every pending job until its time budget.
# The 6 h cron is only a backup. Spend cap: OPENAI_MAX_IMAGES_PER_DAY (repo variable, default 30)
# = roughly $6-7/day at the cap (max is not on the price table: watch qa.gpt.cost).
# Actions budget (private repo, 2,000 min/month, 2 vCPU runner): ~2 min per GPT job (render + gates),
# so a full 30-image day costs ~60-70 min; idle cron runs exit in the first step (~1 billed min).
# A month of daily full-cap days would pass 2,000 min: lower MAX_JOBS / the cap if that becomes normal.
name: imagegen

on:
  schedule:
    - cron: "17 */6 * * *" # backup only: the panel should dispatch a run as soon as jobs are queued
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Max jobs this run"
        default: "30"
      max_minutes:
        description: "Time budget (minutes)"
        default: "25"

permissions:
  contents: read

concurrency:
  group: imagegen
  cancel-in-progress: false

jobs:
  imagegen:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # hard cap per run (25 min of work + setup); keeps the monthly minutes budget
    env:
      BLOO_URL: https://bloo-panel.netlify.app
    steps:
      # Cheap gate: no Python, no model download when there is nothing to do.
      - name: Check pending jobs
        id: pending
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          body=$(curl -fsS --max-time 30 -H "x-cron-secret: ${CRON_SECRET}" "${BLOO_URL}/api/imagegen/pending-count")
          count=$(printf '%s' "$body" | jq -r '.pending // .count // 0')
          echo "pending jobs: ${count}"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.pending.outputs.count != '0'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: imagegen
          persist-credentials: false

      - name: Set up Python
        if: steps.pending.outputs.count != '0'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: imagegen/requirements.txt

      # restore/save split: a plain actions/cache only saves on success, so a failed run
      # re-downloaded ~1.2 GB of weights every time
      - name: Restore rembg / BiRefNet weights
        if: steps.pending.outputs.count != '0'
        id: weights
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: rembg-${{ vars.IMAGEGEN_REMBG_MODEL || 'birefnet-general' }}-gate-lite-v2

      - name: Install dependencies
        if: steps.pending.outputs.count != '0'
        working-directory: imagegen
        run: pip install -r requirements.txt

      - name: Run worker
        if: steps.pending.outputs.count != '0'
        working-directory: imagegen
        env:
          U2NET_HOME: ~/.u2net
          RUNNER_KIND: github # anonymous (per-IP) quota state is kept apart from the PC's
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ALLOW_PAID: ${{ vars.GEMINI_ALLOW_PAID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # unset -> the paid route is skipped, cfedit only
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }} # default gpt-image-2.5-sunburst
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }} # default max (400 on quality -> xhigh -> high, unbilled)
          OPENAI_MAX_IMAGES_PER_DAY: ${{ vars.OPENAI_MAX_IMAGES_PER_DAY }} # default 30 (spend cap, not a delay)
          IMAGEGEN_REMBG_MODEL: ${{ vars.IMAGEGEN_REMBG_MODEL }}
          HF_SPACE_DISABLED: ${{ vars.HF_SPACE_DISABLED }}
          MAX_JOBS: ${{ github.event.inputs.max_jobs || '30' }}
          MAX_MINUTES: ${{ github.event.inputs.max_minutes || '25' }}
          IMAGEGEN_FIRST_JOB_SECONDS: "150" # model load + first job (GPT render ~1-2 min) on 2 vCPU
          # memory: 7 GB runner; ORT arena is off in code, glibc keeps fewer/trimmed heaps
          MALLOC_ARENA_MAX: "2"
          MALLOC_TRIM_THRESHOLD_: "131072"
          PYTHONUNBUFFERED: "1"
        run: python -m imagegen.run --once --max-jobs "$MAX_JOBS" --max-minutes "$MAX_MINUTES"

      - name: Save rembg / BiRefNet weights
        if: always() && steps.pending.outputs.count != '0' && steps.weights.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.u2net
          key: ${{ steps.weights.outputs.cache-primary-key }}

