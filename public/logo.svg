<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none" role="img" aria-label="bloo">
  <!-- Wordmark "bloo" — trazo blanco, minúsculas redondeadas, con la ola de marca dentro de la "o" final.
       Placeholder vectorial: reemplazable por el logo oficial (Halimum) cuando exista. -->
  <g stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- b -->
    <path d="M40 20 V96" />
    <circle cx="60" cy="76" r="18" />
    <!-- l -->
    <path d="M112 20 V96" />
    <!-- o -->
    <circle cx="158" cy="76" r="18" />
    <!-- o final -->
    <circle cx="214" cy="76" r="18" />
    <!-- swash cursivo bajo el wordmark -->
    <path d="M30 108 C 90 118, 180 118, 250 106" stroke-width="5" opacity="0.9" />
  </g>
  <!-- ola dentro de la o final (acento azul de marca) -->
  <path d="M203 76 q 5.5 -8 11 0 q 5.5 8 11 0" stroke="#80A7B6" stroke-width="4" stroke-linecap="round" fill="none" />
</svg>
