[build]
  command = "prisma generate && next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # El sitio tiene NODE_ENV=production como variable de entorno (la app la usa
  # para poner `secure` en la cookie de sesión, ver lib/session.ts). Con eso,
  # `npm ci` se salta las devDependencies — y tailwindcss, typescript y los
  # @types/* viven ahí, así que `next build` muere con
  # "Cannot find module 'tailwindcss'". Esto fuerza a instalarlas igual.
  # Antes no se notaba porque el build corría en la PC de Cris (netlify deploy
  # --build), donde node_modules ya estaba completo.
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# sharp y prisma son módulos nativos: no los bundlee esbuild, inclúyelos tal cual.
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp", "@img/sharp-linux-x64", "@img/sharp-libvips-linux-x64", "@prisma/client", "prisma", ".prisma"]
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@prisma/engines/**",
    "node_modules/@img/sharp-linux-x64/**",
    "node_modules/@img/sharp-libvips-linux-x64/**"
  ]
